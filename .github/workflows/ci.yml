name: CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      env:
        PUPPETEER_SKIP_DOWNLOAD: true
    
    - name: Run ESLint
      run: npm run lint

    - name: Run unit tests
      run: npm run test:unit
    
    - name: Build single file
      run: npm run build
    
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
          name: chrome-pdf-helper
          path: dist/chrome-pdf-helper.js

  integration:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install Google Chrome
      run: |
        wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y
        google-chrome-stable --version
    
    - name: Install dependencies
      run: npm ci
      env:
        PUPPETEER_SKIP_DOWNLOAD: true

    - name: Download verified helper bundle
      uses: actions/download-artifact@v4
      with:
        name: chrome-pdf-helper
        path: dist

    - name: Run integration tests
      run: npm run test:integration

  release:
    needs: [verify, integration]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download verified helper bundle
      uses: actions/download-artifact@v4
      with:
        name: chrome-pdf-helper
        path: dist

    - name: Release verified helper bundle
      uses: X4BNet/action-gh-release@v1
      with:
        files: dist/chrome-pdf-helper.js
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
